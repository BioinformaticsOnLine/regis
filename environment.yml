name: regis_dev
channels:
  - jitendralab
  - bioconda
  - conda-forge
  - defaults
dependencies:
  # Build tools (from requirements: build)
  # Go via conda on Linux only. On macOS (especially Apple Silicon), install Go from
  # Homebrew and build with `unset GOROOT` or `./scripts/build.sh` — conda's GOROOT
  # conflicts with Homebrew's `go` and causes: go: no such tool "compile"
  - go=1.25  # [linux]
  - make

  # Runtime dependencies (from requirements: run)
  - python=3.10
  - fastqc>=0.12.1
  - fastp>=0.23.4
  - sortmerna>=4.3.4
  - trinity>=2.15.2
  - hisat2>=2.2.1
  - samtools>=1.22.1
  - stringtie=2.1.7
  - gffread>=0.12.7
  - cpc2_standalone
  - libsvm
  - viennarna
  - gffcompare
  - seqkit
  - bedtools
  - bedops
  - ucsc-gtftogenepred
  - ucsc-genepredtobed
  - subread
  - cpat
  - intarna
  - rseqc
  - multiqc
  - igv-reports
