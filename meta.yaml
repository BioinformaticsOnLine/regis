{% set name = "regis" %}
{% set version = "1.1.2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  path: .
  exclude:
    - sample/
    - logo/
    - jobs/
    - regis.db
    - "out*/"
    - "*.json"
    - ".git/"
    - "conda-bld/"
    - ".agent/"
    - ".DS_Store"

build:
  noarch: generic
  number: 0
  # Allow standard system libs (libc, libm, libpthread) to be untracked
  # The Go binary only links these at system level, not through conda.
  missing_dso_whitelist:
    - $RPATH/libm.so.6
    - $RPATH/libc.so.6
    - $RPATH/libpthread.so.0
    - $RPATH/libdl.so.2
  
  script: |
    # Use system GCC (not conda-forge GCC 15) to avoid libgcc>=15 run_exports.
    # System GCC on modern Ubuntu/CentOS links against glibc 2.17 ABI.
    export CGO_ENABLED=1
    export CC=gcc
    export CXX=g++
    # Strip debug info and set version; link only minimal system libs
    export CGO_LDFLAGS="-Wl,--as-needed"
    
    # Build with version info and optimizations
    go build -ldflags="-s -w -X github.com/BioinformaticsOnLine/regis/version.Version={{ version }}" -o regis .
    
    # Install to conda prefix
    mkdir -p $PREFIX/bin
    mkdir -p $PREFIX/share/regis/assets
    
    # Copy binary
    install -m 755 regis $PREFIX/bin/regis
    
    # Bundle assets (models, lnctar, etc.)
    cp -r assets/* $PREFIX/share/regis/assets/
    chmod +x $PREFIX/share/regis/assets/lnctar/LncTar.pl

requirements:
  build:
    # Use named compilers WITHOUT the compiler() macro to avoid auto-injecting
    # libgcc>=15 run_exports. The Go binary has minimal C linkage (CGO for SQLite).
    - gcc           # [linux]
    - gxx           # [linux]
    - go >=1.21
    - make
  
  host:
    # Add host section for build-time libs
    - sqlite  # Explicitly declare SQLite dependency
  
  run:
    - python >=3.10,<3.14  # Cap upper version for stability
    - sqlite  # Runtime SQLite dependency
    
    # Core NGS tools
    - fastqc >=0.12.1
    - trimmomatic >=0.39
    - sortmerna >=4.3.4
    
    # Assembly tools
    - trinity >=2.15.2
    - rnabloom >=2.0.1
    - hisat2 >=2.2.1
    - samtools >=1.22.1
    - stringtie >=2.1.7,<2.2  # Relax version constraint
    
    # Sequence manipulation
    - gffread >=0.12.7
    - seqkit
    - bedtools
    - bedops
    
    # UCSC tools
    - ucsc-gtftogenepred
    - ucsc-genepredtobed
    
    # lncRNA prediction
    - cpc2_standalone
    - cpat
    - libsvm
    
    # RNA structure & interactions
    - viennarna
    - intarna
    
    # Quantification & comparison
    - subread
    - gffcompare
    
    # QC & reporting
    - rseqc
    - multiqc
    - igv-reports
    
    # Explicit glibc virtual package constraint.
    # Go+CGO binary only needs system libc/libm/pthread — all modern Linux
    # (glibc 2.17 through 2.39+) satisfy this. This REPLACES the broken
    # libgcc>=15 constraint that the compiler() macro was injecting.
    - __glibc >=2.17  # [linux]

# Modern conda practice: specify channel priority
channels:
  - jitendralab
  - bioconda
  - conda-forge
  - defaults

test:
  commands:
    - regis --version  # Better test - check version works
    - regis --help
    
  # Add import tests if you expose any libraries
  # imports:
  #   - regis

about:
  home: https://github.com/BioinformaticsOnLine/regis
  license: GPL-3.0-or-later  # More specific SPDX identifier
  license_file: LICENSE  # Include license file in package
  summary: "REGIS v{{ version }} - RNA-seq Guided Identification System for lncRNA Discovery (Go implementation, linux-64 glibc compat fix)"
  description: |
    REGIS v{{ version }} is a comprehensive lncRNA identification pipeline implemented in Go
    with a modern Terminal User Interface (TUI). It performs:
    
    - Quality control with FastQC
    - Adapter trimming with Trimmomatic
    - rRNA filtering with SortMeRNA (NEW in v{{ version }})
    - De novo assembly with Trinity OR reference-based alignment with HISAT2
    - Transcript assembly with StringTie
    - Multi-tool coding potential assessment (CPC2 + CPAT for high-confidence predictions)
    - Expression quantification with featureCounts
    - Novel lncRNA classification with gffcompare
    - Secondary structure prediction with RNAfold
    - lncRNA-mRNA interaction prediction with LncTar
    - RNA-RNA interaction cross-validation with IntaRNA
    - Consensus target analysis
    - Gene list building for enrichment analysis (getENRICH-ready)
    - Comprehensive visualization (IGV reports, RSeQC, MultiQC)
    
    NEW in v1.0.1:
    - Go implementation with TUI (Terminal User Interface)
    - SortMeRNA integration for rRNA filtering
    - Automatic SILVA database download
    - Background gene list generation for enrichment
    - Real-time progress tracking with animated TUI
    - System resource monitoring (CPU/Memory)
    - Interactive help and command display
    

    The pipeline supports both single-end and paired-end data,
    and can work with or without a reference genome.
    
    REGIS Team:
    Dr. Jitendra Narayan (Principal Investigator)
    Dr. Stefano Tiozzo (CNRS-Sorbonne University)
    Pranjal Pruthi (Researcher Programmer, CSIR IGIB)
    
    Funded by The Rockefeller Foundation and CSIR-IGIB.
  doc_url: https://github.com/BioinformaticsOnLine/regis
  dev_url: https://github.com/BioinformaticsOnLine/regis

extra:
  recipe-maintainers:
    - jitendralab
    - pranjal-pruthi
  identifiers:
    - biotools:regis